[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rupantar"
version = "0.0.0"
description = "Offline, air-gapped AI content transformation engine (NTRO / SIH)."
readme = "README.md"
requires-python = "==3.11.*"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "typer>=0.12",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "fastapi>=0.115,<0.128",
    "uvicorn>=0.30",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "fpdf2>=2.8",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "pyarrow>=17",
    "pypdf>=5",
    "selectolax>=0.3",
    "faster-whisper>=1.1",
    "pymupdf>=1.24",
    "psutil>=6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "types-PyYAML>=6.0",
]

[project.scripts]
rupantar = "rupantar.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rupantar = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: tests that need real model files on disk",
]
