# Loopback-published front door for the air-gapped rupantar container.
server {
    listen 8080;

    # Source uploads (video, PDFs) can be large.
    client_max_body_size 2g;

    location / {
        proxy_pass http://rupantar:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        # SSE (run events, token streams, Q&A answers) must not be buffered, and a
        # 7-artefact CPU run plus verification can hold a stream open for many minutes.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
