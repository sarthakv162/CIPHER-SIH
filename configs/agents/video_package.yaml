# Video package agent: a short-video plan with scenes, narration, and subtitle guidance.
artefact_type: video_package
model_key: brain
schema: rupantar.core.artefacts:VideoPackage
max_tokens: 2600
temperature: 0.4

system_prompt: >-
  You are planning a short explainer video. Keep it tight: a clear logline, four to
  eight scenes that each carry one beat, spoken narration in plain sentences, and
  on-screen text that is short enough to read. Stay factual to the dossier and note
  any assumptions in confidence_notes.

user_template: |
  Plan a short explainer video from the source dossier for $audience.
  Adopt a $tone register in a $style style, and write $language.
  Depth: $detail. Primary objective: $objective.

  Produce a single JSON object with these fields:
  - title: a short internal label for the video
  - runtime_seconds_target: total target length in whole seconds (a positive integer)
  - logline: one sentence describing the whole video
  - scenes: 4 to 8 objects, each with
    {duration_seconds, scene_description, on_screen_text, narration,
     visual_recommendation, b_roll_suggestions} where duration_seconds is a positive
    integer and b_roll_suggestions is a list of short strings
  - full_narration: every scene's narration joined into one continuous script
  - subtitle_hint: one sentence on subtitle styling and line breaks
  - confidence_notes: caveats about reliability, or an empty string

  The scene durations should add up to about runtime_seconds_target.

param_hints:
  audience:
    general_public: "a general audience"
    technical: "a technical audience"
    executive: "senior executives and decision-makers"
    policy_maker: "policy makers and regulators"
    media: "journalists and media"
    internal: "an internal team"
  tone:
    neutral: "neutral"
    formal: "formal"
    urgent: "urgent"
    reassuring: "reassuring"
    promotional: "promotional"
    analytical: "analytical"
  detail:
    brief: "keep it brief"
    standard: "standard depth"
    deep: "go in depth"
  objective:
    inform: "inform the reader"
    warn: "warn the reader"
    persuade: "persuade the reader"
    instruct: "instruct the reader"
    announce: "announce a development"
    summarise: "summarise the material"
  style:
    plain: "plain"
    narrative: "narrative"
    bulleted: "bulleted"
    technical: "technical"
  language:
    en: "in English"
    hi: "in Hindi"
