# Model registry. Sizes are approximate placeholders.
# registry.py MUST read the real file size and SHA-256 at startup and use those in provenance manifests.
# Filenames must be confirmed against the actual GGUF builds fetched by scripts/fetch_models.sh.
# approx_bytes must be plain digits: YAML does not parse underscore digit grouping.
# registry.py skips file-existence and SHA-256 checks for any entry whose runtime is "stub".

active_profile: laptop-16gb

runtimes:
  llama:
    binary: llama-server
    host: 127.0.0.1
    common_args: ["--no-webui", "--log-disable"]
  whisper:
    module: rupantar.models.runtime_whisper
  piper:
    binary: piper

profiles:

  laptop-16gb:
    brain:
      class: heavy
      runtime: llama
      path: models/brain/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
      sha256: 3605803b982cb64aead44f6c1b2ae36e3acdb41d8e46c8a94c6533bc4c67e597
      approx_bytes: 2497281120
      args: ["--ctx-size", "8192", "--threads", "6", "--n-gpu-layers", "0"]
      notes: "--n-gpu-layers is a no-op on Apple Silicon: llama.cpp uses Metal by default (36.6 vs 36.8 tok/s at 0 vs 99). Kept 0 here; the titan-24gb / Linux-CUDA profile needs 99."

    vlm:
      class: heavy
      runtime: llama
      path: models/vlm/Qwen2.5-VL-3B-Instruct-Q4_K_M.gguf
      mmproj: models/vlm/mmproj-Qwen2.5-VL-3B-f16.gguf
      approx_bytes: 3100000000
      args: ["--ctx-size", "4096", "--threads", "6"]

    asr:
      class: light
      runtime: whisper
      path: models/asr/faster-whisper-small.en-int8
      approx_bytes: 500000000
      args: {compute_type: int8, beam_size: 1}

    tts:
      class: transient
      runtime: piper
      path: models/tts/en_US-lessac-medium.onnx
      config: models/tts/en_US-lessac-medium.onnx.json
      approx_bytes: 65000000

  titan-24gb:
    brain:
      class: heavy
      runtime: llama
      path: models/brain/Qwen2.5-14B-Instruct-Q4_K_M.gguf
      approx_bytes: 9000000000
      args: ["--ctx-size", "16384", "--n-gpu-layers", "99"]

    vlm:
      class: heavy
      runtime: llama
      path: models/vlm/Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf
      mmproj: models/vlm/mmproj-Qwen2.5-VL-7B-f16.gguf
      approx_bytes: 5500000000
      args: ["--ctx-size", "8192", "--n-gpu-layers", "99"]

    asr:
      class: light
      runtime: whisper
      path: models/asr/faster-whisper-medium.en-int8
      approx_bytes: 1500000000
      args: {compute_type: int8, beam_size: 5}

    tts:
      class: transient
      runtime: piper
      path: models/tts/en_US-lessac-medium.onnx
      config: models/tts/en_US-lessac-medium.onnx.json
      approx_bytes: 65000000

  test-stub:
    brain:  {class: heavy, runtime: stub}
    vlm:    {class: heavy, runtime: stub}
    asr:    {class: light, runtime: stub}
    tts:    {class: transient, runtime: stub}
